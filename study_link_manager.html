<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界史の民</title>
<style>
:root{
  --bg-base:#FFFFFF;
  --bg-soft:#F9F9F9;
  --text-main:#333333;
  --text-sub:#666666;
  --accent:#E53935;
  --accent-dark:#D32F2F;
  --link:#1E88E5;
  --link-dark:#0D47A1;
  --border:#E3E3E3;
  --border-strong:#CFCFCF;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg-soft);
  color:var(--text-main);
  -webkit-font-smoothing:antialiased;
}
#app{
  height:100vh;
  display:flex;
  flex-direction:column;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ===== Toolbar ===== */
header.toolbar{
  background:var(--bg-base);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
  box-shadow:var(--shadow);
  z-index:30;
  flex-shrink:0;
}
.toolbar-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.toolbar-row + .toolbar-row{margin-top:8px;}
.brand{
  font-size:17px;
  font-weight:800;
  color:var(--text-main);
  letter-spacing:.02em;
  margin-right:6px;
  white-space:nowrap;
}
.brand span{color:var(--accent);}
.seg{
  display:inline-flex;
  border:1px solid var(--border-strong);
  border-radius:8px;
  overflow:hidden;
  background:var(--bg-base);
}
.seg button{
  border:none;
  background:transparent;
  padding:7px 12px;
  font-size:13px;
  color:var(--text-sub);
  border-right:1px solid var(--border-strong);
  white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg button:last-child{border-right:none;}
.seg button.active{
  background:var(--text-main);
  color:#fff;
  font-weight:600;
}
.seg button:hover:not(.active){background:var(--bg-soft);}

.search-box{
  position:relative;
  flex:1;
  min-width:160px;
}
.search-box input{
  width:100%;
  padding:8px 10px 8px 30px;
  border:1px solid var(--border-strong);
  border-radius:8px;
  font-size:13px;
  background:var(--bg-soft);
  color:var(--text-main);
}
.search-box input:focus{outline:2px solid var(--link);outline-offset:0;background:#fff;}
.search-box::before{
  content:"🔍";
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  font-size:12px;opacity:.6;
}
select.sort-select{
  padding:7px 8px;
  border:1px solid var(--border-strong);
  border-radius:8px;
  font-size:13px;
  background:var(--bg-base);
  color:var(--text-main);
}
.btn{
  border:1px solid var(--border-strong);
  background:var(--bg-base);
  color:var(--text-main);
  padding:7px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.btn:hover{background:var(--bg-soft);}
.btn.primary{background:var(--text-main);color:#fff;border-color:var(--text-main);}
.btn.primary:hover{background:#1f1f1f;}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.accent:hover{background:var(--accent-dark);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-sub);}
.btn.ghost:hover{background:var(--bg-soft);color:var(--text-main);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.small{padding:4px 8px;font-size:12px;border-radius:6px;}
.spacer{flex:1;}

/* ===== Content ===== */
.content-wrap{
  flex:1;
  overflow-y:auto;
  position:relative;
  padding:0 16px 40px;
}
.sticky-head{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--bg-soft);
  padding-top:12px;
}
.breadcrumb-bar{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:4px;
  background:var(--bg-base);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
  margin-bottom:8px;
  box-shadow:var(--shadow);
}
.breadcrumb-bar .crumb{
  color:var(--link);
  cursor:pointer;
  font-weight:600;
}
.breadcrumb-bar .crumb:hover{text-decoration:underline;color:var(--link-dark);}
.breadcrumb-bar .sep{color:var(--text-sub);}
.breadcrumb-bar .crumb.current{color:var(--text-main);cursor:default;font-weight:700;}
.breadcrumb-bar .crumb.current:hover{text-decoration:none;}

.list-header{
  display:grid;
  grid-template-columns:28px 26px minmax(120px,2fr) 1.4fr 1.6fr 90px;
  gap:8px;
  padding:8px 10px;
  font-size:11.5px;
  font-weight:700;
  color:var(--text-sub);
  background:#EFEFEF;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:6px;
  letter-spacing:.02em;
}

#mainContent{padding-bottom:10px;}
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--text-sub);
  font-size:14px;
}
.empty-state .big{font-size:34px;margin-bottom:8px;}

/* ---- accordion ---- */
.node-block{margin-bottom:6px;}
.folder-row, .item-row{
  display:grid;
  grid-template-columns:28px 26px minmax(120px,2fr) 1.4fr 1.6fr 90px;
  gap:8px;
  align-items:center;
  background:var(--bg-base);
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 10px;
  transition:background .12s,box-shadow .12s,transform .1s;
}
.folder-row{cursor:pointer;font-weight:700;}
.folder-row:hover, .item-row:hover{background:#FBFBFD;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.folder-row.drag-over{outline:2px dashed var(--accent);background:#FFF3F2;}
.item-row.drag-over{outline:2px dashed var(--link);}
.drag-handle{cursor:grab;color:#BBB;text-align:center;font-size:14px;user-select:none;}
.node-icon{font-size:16px;text-align:center;}
.toggle-caret{display:inline-block;width:14px;transition:transform .15s;color:var(--text-sub);}
.toggle-caret.open{transform:rotate(90deg);}
.node-name{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-main);
  display:flex;align-items:center;gap:6px;
}
.node-count{color:var(--text-sub);font-weight:500;font-size:11.5px;background:var(--bg-soft);border-radius:10px;padding:1px 7px;}
.meta-col{font-size:12.5px;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-tag{
  display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;
  background:#FDECEA;color:var(--accent-dark);margin-right:4px;white-space:nowrap;
}
.url-col a{
  color:var(--link);text-decoration:none;font-size:12.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;
}
.url-col a:hover{color:var(--link-dark);text-decoration:underline;}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.icon-btn{
  border:none;background:transparent;color:var(--text-sub);font-size:14px;
  padding:4px 6px;border-radius:6px;
}
.icon-btn:hover{background:var(--bg-soft);color:var(--text-main);}
.icon-btn.del:hover{background:#FDECEA;color:var(--accent-dark);}
.icon-btn.add:hover{background:#E8F0FE;color:var(--link-dark);}

.accordion-children{
  margin-left:26px;
  padding-left:12px;
  border-left:2px solid var(--border);
  margin-top:6px;
  display:none;
}
.accordion-children.open{display:block;}
.node-block.depth-guide{position:relative;}

/* ---- drive mode ---- */
.drive-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
  margin-bottom:16px;
}
.drive-card{
  background:var(--bg-base);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 10px 10px;
  text-align:center;
  cursor:pointer;
  position:relative;
  transition:box-shadow .12s,transform .1s,background .12s;
}
.drive-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.09);transform:translateY(-1px);}
.drive-card.drag-over{outline:2px dashed var(--accent);background:#FFF3F2;}
.drive-card .icon{font-size:30px;margin-bottom:6px;}
.drive-card .name{font-size:12.5px;font-weight:600;word-break:break-word;line-height:1.3;}
.drive-card .count{font-size:11px;color:var(--text-sub);margin-top:3px;}
.drive-card .card-actions{
  position:absolute;top:4px;right:4px;display:flex;gap:2px;opacity:0;transition:opacity .12s;
}
.drive-card:hover .card-actions{opacity:1;}
.drive-list-title{font-size:12px;font-weight:700;color:var(--text-sub);margin:14px 2px 6px;}

/* ---- search results ---- */
.search-path{font-size:11.5px;color:var(--text-sub);margin-top:2px;}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,20,20,.45);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal-overlay.hidden{display:none;}
.modal{
  background:#fff;border-radius:12px;width:100%;max-width:440px;
  max-height:88vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.25);
}
.modal.modal-lg{max-width:720px;}
.modal.hidden{display:none;}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;
}
.modal-head h2{font-size:16px;margin:0;color:var(--text-main);}
.modal-close{border:none;background:none;font-size:18px;color:var(--text-sub);padding:2px 6px;border-radius:6px;}
.modal-close:hover{background:var(--bg-soft);}
.modal-body{padding:16px 18px;}
.modal-foot{
  padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;
  position:sticky;bottom:0;background:#fff;
}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-sub);margin-bottom:5px;}
.field input[type=text],.field input[type=url],.field select{
  width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:7px;font-size:13.5px;color:var(--text-main);background:#fff;
}
.field input:focus,.field select:focus{outline:2px solid var(--link);}
.field-hint{font-size:11px;color:var(--text-sub);margin-top:4px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

/* settings modal */
.settings-tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.settings-tabs button{
  border:none;background:none;padding:9px 4px;font-size:13px;font-weight:700;color:var(--text-sub);
  border-bottom:2px solid transparent;
}
.settings-tabs button.active{color:var(--accent-dark);border-bottom-color:var(--accent);}
.settings-pane{display:none;}
.settings-pane.active{display:block;}
.master-row{
  display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:13px;
}
.master-row input[type=text]{flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;}
.master-row select{padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;}
.master-add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.master-add-row input[type=text]{flex:1;min-width:120px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;}
.data-io-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.io-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--bg-soft);}
.io-card h3{margin:0 0 6px;font-size:13.5px;color:var(--text-main);}
.io-card p{margin:0 0 10px;font-size:12px;color:var(--text-sub);line-height:1.5;}
.io-card .io-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hidden-file-input{display:none;}
.pill-count{font-size:11px;color:#fff;background:var(--accent);border-radius:10px;padding:1px 7px;margin-left:6px;}

/* toast */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--text-main);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* responsive */
@media (max-width:780px){
  .list-header{display:none;}
  .folder-row,.item-row{
    grid-template-columns:22px 22px 1fr 66px;
    grid-template-areas:"drag icon name actions" "drag icon meta actions" "drag icon url actions";
    row-gap:2px;
  }
  .drag-handle{grid-area:drag;}
  .node-icon{grid-area:icon;}
  .node-name{grid-area:name;}
  .meta-col:nth-of-type(1){grid-area:meta;}
  .url-col{grid-area:url;}
  .row-actions{grid-area:actions;}
  .data-io-grid{grid-template-columns:1fr;}
  .brand{font-size:15px;}
}
@media (max-width:480px){
  .content-wrap{padding:0 8px 30px;}
  header.toolbar{padding:8px 10px;}
  .drive-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
}
</style>
</head>
<body>
<div id="app">
  <header class="toolbar">
    <div class="toolbar-row">
      <div class="brand">世界史情報源～授業作成に備えて～<span>学園外への流出禁止</span></div>
      <div class="seg" id="modeSeg">
        <button data-mode="accordion">アコーディオン</button>
        <button data-mode="drive">ドライブ階層</button>
      </div>
      <div class="seg" id="classSeg">
        <button data-class="unit">単元分類</button>
        <button data-class="site">Webサイト分類</button>
      </div>
      <div class="spacer"></div>
      <button class="btn primary" id="btnNewFile">＋ 新規ファイル</button>
      <button class="btn" id="btnNewFolder">＋ 新規フォルダ</button>
      <button class="btn ghost" id="btnSettings">⚙ 設定・マスター管理</button>
    </div>
    <div class="toolbar-row">
      <div class="search-box"><input type="text" id="searchInput" placeholder="タイトル・URL・カテゴリ・フォルダ名で検索"></div>
      <select class="sort-select" id="sortSelect">
        <option value="name-asc">名前 昇順 (A→Z / あ→ん)</option>
        <option value="name-desc">名前 降順 (Z→A / ん→あ)</option>
        <option value="id-asc">ID 昇順</option>
        <option value="id-desc">ID 降順</option>
      </select>
    </div>
  </header>

  <div class="content-wrap" id="contentWrap">
    <div class="sticky-head">
      <div class="breadcrumb-bar hidden" id="breadcrumbBar"></div>
      <div class="list-header" id="listHeaderRow">
        <span></span><span></span><span>名前</span><span>分類</span><span>URL</span><span style="text-align:right;">操作</span>
      </div>
    </div>
    <main id="mainContent"></main>
  </div>
</div>

<!-- Item Modal -->
<div class="modal-overlay hidden" id="itemOverlay">
  <div class="modal" id="itemModal">
    <div class="modal-head"><h2 id="itemModalTitle">新規ファイル（リンク項目）</h2><button class="modal-close" data-close="itemOverlay">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>タイトル / ファイル名</label>
        <input type="text" id="fTitle" placeholder="例）20-1 連合国から国際連合へ">
      </div>
      <div class="field">
        <label>URL</label>
        <input type="url" id="fUrl" placeholder="https://example.com/...">
      </div>
      <div class="field-row">
        <div class="field">
          <label>カテゴリ</label>
          <select id="fCategory"></select>
        </div>
        <div class="field">
          <label>Webサイト</label>
          <select id="fSite"></select>
        </div>
      </div>
      <div class="field">
        <label>所属フォルダ（単元）</label>
        <select id="fFolder"></select>
        <div class="field-hint" id="fFolderHint"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close="itemOverlay">キャンセル</button>
      <button class="btn accent" id="btnSaveItem">保存する</button>
    </div>
  </div>
</div>

<!-- Folder Modal -->
<div class="modal-overlay hidden" id="folderOverlay">
  <div class="modal" id="folderModal">
    <div class="modal-head"><h2 id="folderModalTitle">新規フォルダ</h2><button class="modal-close" data-close="folderOverlay">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>フォルダ名（大項目 / 章 / 小単元）</label>
        <input type="text" id="fFolderName" placeholder="例）終戦をめぐる攻防と冷戦の予兆">
      </div>
      <div class="field">
        <label>親フォルダ</label>
        <select id="fParentFolder"></select>
        <div class="field-hint" id="fParentHint"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close="folderOverlay">キャンセル</button>
      <button class="btn accent" id="btnSaveFolder">保存する</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay hidden" id="settingsOverlay">
  <div class="modal modal-lg" id="settingsModal">
    <div class="modal-head"><h2>設定・マスター管理画面</h2><button class="modal-close" data-close="settingsOverlay">✕</button></div>
    <div class="modal-body">
      <div class="settings-tabs">
        <button class="stab active" data-tab="cats">カテゴリ管理</button>
        <button class="stab" data-tab="sites">Webサイト管理</button>
        <button class="stab" data-tab="data">データ入出力（JSON / CSV）</button>
      </div>

      <div class="settings-pane active" id="paneCats">
        <div id="catList"></div>
        <div class="master-add-row">
          <input type="text" id="newCatName" placeholder="新しいカテゴリ名">
          <button class="btn primary small" id="btnAddCat">＋ カテゴリ追加</button>
        </div>
      </div>

      <div class="settings-pane" id="paneSites">
        <div id="siteList"></div>
        <div class="master-add-row">
          <input type="text" id="newSiteName" placeholder="新しいWebサイト名">
          <select id="newSiteCat"></select>
          <button class="btn primary small" id="btnAddSite">＋ サイト追加</button>
        </div>
      </div>

      <div class="settings-pane" id="paneData">
        <div class="data-io-grid">
          <div class="io-card">
            <h3>JSON（全データ）</h3>
            <p>フォルダ・サイト・カテゴリ・リンクをすべて含む構成ファイルです。別端末でも同じ構成を復元できます。</p>
            <div class="io-btns">
              <button class="btn primary small" id="btnJsonExport">出力（ダウンロード）</button>
              <button class="btn small" id="btnJsonImportLabel">入力（読み込み）</button>
              <input type="file" accept="application/json" class="hidden-file-input" id="jsonFileInput">
            </div>
          </div>
          <div class="io-card">
            <h3>CSV（リンク一覧）</h3>
            <p>ファイルID, タイトル, URL, カテゴリ名, 親フォルダID, 親フォルダ名, フォルダパスを出力・取込します。</p>
            <div class="io-btns">
              <button class="btn primary small" id="btnCsvExport">出力（ダウンロード）</button>
              <button class="btn small" id="btnCsvImportLabel">入力（読み込み）</button>
              <input type="file" accept=".csv" class="hidden-file-input" id="csvFileInput">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close="settingsOverlay">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   1. データモデル & 初期シードデータ
   ========================================================= */
function seedData(){
  const categories = [
    {id:'cat_01', name:'主要内容'},
    {id:'cat_02', name:'詳細（授業）'},
    {id:'cat_03', name:'補足教科書'},
    {id:'cat_04', name:'本情報'}
  ];
  const sites = [
    {id:'site_001', name:'研伸館ジオヒストリー', categoryId:'cat_01'},
    {id:'site_002', name:'グシャの世界史探求', categoryId:'cat_01'},
    {id:'site_003', name:'相関図・関係図', categoryId:'cat_02'},
    {id:'site_004', name:'スタサプスタンダード', categoryId:'cat_02'},
    {id:'site_005', name:'スタサプTry it', categoryId:'cat_02'},
    {id:'site_006', name:'世界史の窓', categoryId:'cat_03'},

const STATE = {
  mode:'accordion',        // accordion | drive
  classification:'unit',   // unit | site
  search:'',
  sort:'name-asc',
  expanded:new Set(),      // accordion expanded node ids
  currentPath:[],          // drive mode path (array of {id,name,type})

  dragging:null,           // {id,type}
};

/* =========================================================
   3. ユーティリティ
   ========================================================= */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>t.classList.remove('show'),2200);
}
function nextId(prefix, arr){
  let max = 0;
  arr.forEach(o=>{
    const m = String(o.id).match(/_(\d+)$/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return prefix+'_'+String(max+1).padStart(3,'0');
}
function idNum(id){
  const m = String(id).match(/_(\d+)$/);
  return m? parseInt(m[1],10) : 0;
}
function catName(id){ const c = DB.categories.find(x=>x.id===id); return c? c.name : '(未分類)'; }
function siteName(id){ const s = DB.sites.find(x=>x.id===id); return s? s.name : '(未設定)'; }
function folderById(id){ return DB.folders.find(f=>f.id===id); }

function folderPath(folderId){
  const names = [];
  let cur = folderById(folderId);
  let guard = 0;
  while(cur && guard++ < 50){
    names.unshift(cur.name);
    cur = cur.parentId? folderById(cur.parentId) : null;
  }
  return names.join(' ＞ ');
}
function getDescendantFolderIds(folderId){
  const out = [];
  const stack = [folderId];
  while(stack.length){
    const cur = stack.pop();
    DB.folders.filter(f=>f.parentId===cur).forEach(f=>{ out.push(f.id); stack.push(f.id); });
  }
  return out;
}
function isFolderOrDescendant(candidateId, ancestorId){
  if(candidateId===ancestorId) return true;
  return getDescendantFolderIds(ancestorId).includes(candidateId);
}

/* =========================================================
   4. ツリー抽象化（単元分類 / サイト分類 共通インターフェース）
   ========================================================= */
// ノード種別: folder / category / site / item
function getChildNodes(parentId, classification){
  if(classification==='unit'){
    const folders = DB.folders.filter(f=>f.parentId===parentId).map(f=>({id:f.id,type:'folder',name:f.name,order:f.order}));
    const items = DB.items.filter(it=>it.folderId===parentId).map(it=>({id:it.id,type:'item',name:it.title,order:it.order,ref:it}));
    return {containers:folders, items:items};
  }else{
    if(parentId===null){
      const cats = DB.categories.map(c=>({id:c.id,type:'category',name:c.name,order:0}));
      return {containers:cats, items:[]};
    }
    if(String(parentId).startsWith('cat_')){
      const sites = DB.sites.filter(s=>s.categoryId===parentId).map(s=>({id:s.id,type:'site',name:s.name,order:0}));
      return {containers:sites, items:[]};
    }
    if(String(parentId).startsWith('site_')){
      const items = DB.items.filter(it=>it.siteId===parentId).map(it=>({id:it.id,type:'item',name:it.title,order:it.order,ref:it}));
      return {containers:[], items:items};
    }
    return {containers:[], items:[]};
  }
}
function containerChildCount(node, classification){
  // recursively counts leaf items under a container node (for display badge)
  let count = 0;
  const stack=[node.id];
  const seenTypes = {};
  function visit(id,type){
    const kids = getChildNodes(id, classification);
    count += kids.items.length;
    kids.containers.forEach(c=>visit(c.id,c.type));
  }
  visit(node.id, node.type);
  return count;
}

/* =========================================================
   5. 並び替え / 検索
   ========================================================= */
function sortNodes(nodes){
  const s = STATE.sort;
  const arr = nodes.slice();
  arr.sort((a,b)=>{
    if(s==='name-asc') return a.name.localeCompare(b.name,'ja');
    if(s==='name-desc') return b.name.localeCompare(a.name,'ja');
    if(s==='id-asc') return idNum(a.id)-idNum(b.id);
    if(s==='id-desc') return idNum(b.id)-idNum(a.id);
    return (a.order||0)-(b.order||0);
  });
  return arr;
}

function searchAllItems(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return DB.items.filter(it=>{
    const hay = [
      it.title, it.url, catName(it.categoryId), siteName(it.siteId), folderPath(it.folderId), it.id
    ].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function buildAccordionContainer(node, depth){
  const isOpen = STATE.expanded.has(node.id);
  const kids = getChildNodes(node.id, STATE.classification);
  const count = kids.items.length + kids.containers.length;
  const canDelete = true;
  let inner = '';
  if(isOpen){
    const sortedContainers = sortNodes(kids.containers);
    const sortedItems = sortNodes(kids.items);
    inner += sortedContainers.map(c=>buildAccordionContainer(c, depth+1)).join('');
    inner += sortedItems.map(it=>buildItemRow(it.ref, depth+1)).join('');
    if(!sortedContainers.length && !sortedItems.length){
      inner = `<div class="empty-state" style="padding:18px;"><div>このフォルダには項目がありません</div></div>`;
    }
  }
  return `
  <div class="node-block">
    <div class="folder-row" draggable="true" data-id="${node.id}" data-type="${node.type}" data-act="toggle">
      <span class="drag-handle">⋮⋮</span>
      <span class="node-icon toggle-caret ${isOpen?'open':''}">▶</span>
      <span class="node-name" title="${escapeHtml(node.name)}">${nodeIcon(node.type)}&nbsp;${escapeHtml(node.name)}<span class="node-count">${count}</span></span>
      <span class="meta-col">${node.type==='folder'? '単元フォルダ' : (node.type==='category'? 'カテゴリ' : 'Webサイト')}</span>

      </span>
    </div>
    <div class="accordion-children ${isOpen?'open':''}">${inner}</div>
  </div>`;
}

function renderAccordion(){
  const kids = getChildNodes(null, STATE.classification);
  const containers = sortNodes(kids.containers);
  const items = sortNodes(kids.items);
  if(!containers.length && !items.length){
    return `<div class="empty-state"><div class="big">🗂️</div>データがありません。「新規フォルダ」または「新規ファイル」から追加してください。</div>`;
  }
  return containers.map(c=>buildAccordionContainer(c,0)).join('') + items.map(it=>buildItemRow(it.ref,0)).join('');
}

function renderDrive(){
  const parentId = STATE.currentPath.length ? STATE.currentPath[STATE.currentPath.length-1].id : null;
  const kids = getChildNodes(parentId, STATE.classification);

    return `<div class="empty-state"><div class="big">📭</div>このフォルダは空です。</div>`;

/* =========================================================
   7. イベント処理（一覧内: 委任）
   ========================================================= */
function bindRowEvents(){
  const main = document.getElementById('mainContent');
  main.querySelectorAll('[data-act="toggle"]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      if(e.target.closest('[data-act]')!==el) return; // avoid double trigger from inner buttons
      const id = el.dataset.id;
      if(STATE.expanded.has(id)) STATE.expanded.delete(id); else STATE.expanded.add(id);
      renderMain();
    });
  });
  main.querySelectorAll('[data-act="drive-open"]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      if(e.target.closest('.card-actions')) return;
      const id = el.dataset.id, type = el.dataset.type, name = el.querySelector('.name').textContent;
      STATE.currentPath.push({id,name,type});
      STATE.addContext = {type, id};
      renderBreadcrumb(); renderMain();
    });
  });
  main.querySelectorAll('[data-act="add-here"]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      STATE.addContext = {type:el.dataset.type, id:el.dataset.id};
      if(el.dataset.type==='folder' || el.dataset.type==='category' || el.dataset.type==='site'){
        openItemModal({mode:'add'});
      }
    });
  });
  main.querySelectorAll('[data-act="edit-item"]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); openItemModal({mode:'edit', id:el.dataset.id}); });
  });
  main.querySelectorAll('[data-act="del-item"]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); deleteItem(el.dataset.id); });
  });
  main.querySelectorAll('[data-act="edit-folder"]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); openFolderModal({mode:'edit', id:el.dataset.id}); });
  });
  main.querySelectorAll('[data-act="del-folder"]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); deleteFolder(el.dataset.id); });
  });

  // drag & drop
  main.querySelectorAll('[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      STATE.dragging = {id:el.dataset.id, type:el.dataset.type};
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain', el.dataset.id); }catch(err){}
    });
    el.addEventListener('dragend', ()=>{ STATE.dragging=null; });
  });
  main.querySelectorAll('.folder-row, .drive-card, .item-row').forEach(el=>{
    el.addEventListener('dragover', e=>{
      if(!STATE.dragging) return;
      e.preventDefault();
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', ()=>{ el.classList.remove('drag-over'); });
    el.addEventListener('drop', e=>{
      e.preventDefault();
      el.classList.remove('drag-over');
      if(!STATE.dragging) return;
      const targetId = el.dataset.id, targetType = el.dataset.type;
      handleDrop(STATE.dragging.id, STATE.dragging.type, targetId, targetType);
      STATE.dragging = null;
    });
  });
}

/* =========================================================
   8. ドラッグ&ドロップ移動ロジック
   ========================================================= */
function renumber(list){ list.forEach((o,idx)=>o.order=idx); }

function reorderSiblings(kind, key, keyVal, draggedId, targetId){
  let arr;
  if(kind==='folder') arr = DB.folders.filter(f=>f.parentId===keyVal);
  else arr = DB.items.filter(i=>i[key]===keyVal);
  arr.sort((a,b)=>(a.order||0)-(b.order||0));
  const fromIdx = arr.findIndex(x=>x.id===draggedId);
  const toIdx = arr.findIndex(x=>x.id===targetId);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = arr.splice(fromIdx,1);
  arr.splice(toIdx,0,moved);
  renumber(arr);
}

function handleDrop(draggedId, draggedType, targetId, targetType){
  if(draggedId===targetId) return;
  if(STATE.classification==='unit'){
    if(targetType==='folder'){
      if(draggedType==='folder'){
        if(isFolderOrDescendant(targetId, draggedId)){ toast('自分自身の下位フォルダには移動できません'); return; }
        const f = folderById(draggedId);
        if(f.parentId===targetId) return;
        f.parentId = targetId;
        const sibs = DB.folders.filter(x=>x.parentId===targetId);
        renumber(sibs.sort((a,b)=>(a.order||0)-(b.order||0)));
      }else if(draggedType==='item'){
        const it = DB.items.find(i=>i.id===draggedId);
        it.folderId = targetId;
        const sibs = DB.items.filter(x=>x.folderId===targetId);
        renumber(sibs.sort((a,b)=>(a.order||0)-(b.order||0)));
      }
    }else if(targetType==='item'){
      const targetItem = DB.items.find(i=>i.id===targetId);
      if(draggedType==='item'){
        const dragged = DB.items.find(i=>i.id===draggedId);
        if(dragged.folderId===targetItem.folderId){
          reorderSiblings('item','folderId',dragged.folderId,draggedId,targetId);
        }else{
          dragged.folderId = targetItem.folderId;
          const sibs = DB.items.filter(x=>x.folderId===targetItem.folderId);
          renumber(sibs.sort((a,b)=>(a.order||0)-(b.order||0)));
        }
      }else if(draggedType==='folder'){
        if(isFolderOrDescendant(targetItem.folderId, draggedId)){ toast('移動できません'); return; }
        const f = folderById(draggedId);
        f.parentId = targetItem.folderId;
      }
    }
  }else{
    // site classification
    if(draggedType==='item'){
      const dragged = DB.items.find(i=>i.id===draggedId);
      if(targetType==='site'){
        const site = DB.sites.find(s=>s.id===targetId);
        dragged.siteId = targetId; dragged.categoryId = site.categoryId;
        const sibs = DB.items.filter(x=>x.siteId===targetId);
        renumber(sibs.sort((a,b)=>(a.order||0)-(b.order||0)));
      }else if(targetType==='category'){
        toast('カテゴリではなく、その中のWebサイトへドロップしてください');
        return;
      }else if(targetType==='item'){
        const targetItem = DB.items.find(i=>i.id===targetId);
        if(dragged.siteId===targetItem.siteId){
          reorderSiblings('item','siteId',dragged.siteId,draggedId,targetId);
        }else{
          dragged.siteId = targetItem.siteId; dragged.categoryId = targetItem.categoryId;
        }
      }
    }else{
      toast('サイト分類ではフォルダの移動はできません');
      return;
    }
  }
  persist();
  renderMain();
  toast('移動しました');
}

/* ---- flatten folders with indentation, honoring restriction/exclusion ---- */
function flattenFolders({restrictToId=null, excludeIds=[]}={}){
  const roots = restrictToId
    ? [folderById(restrictToId)].filter(Boolean)
    : DB.folders.filter(f=>f.parentId===null);
  const out = [];
  function visit(f, depth){
    if(!f || excludeIds.includes(f.id)) return;
    out.push({id:f.id, name:('　'.repeat(depth)+(depth>0?'└ ':'')+f.name)});
    DB.folders.filter(c=>c.parentId===f.id).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(c=>visit(c, depth+1));
  }
  if(restrictToId){
    visit(folderById(restrictToId), 0);
  }else{
    DB.folders.filter(f=>f.parentId===null).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(f=>visit(f,0));
  }
  return out;
}

  const f = folderById(id);
  if(!f) return;
  const descFolders = getDescendantFolderIds(id);
  const allFolderIds = [id, ...descFolders];
  const affectedItems = DB.items.filter(it=>allFolderIds.includes(it.folderId));
  const msg = (descFolders.length || affectedItems.length)
    ? `「${f.name}」には下位フォルダ${descFolders.length}件・リンク${affectedItems.length}件があります。すべて削除しますか？`
    : `「${f.name}」を削除しますか？`;
  if(!confirm(msg)) return;
  DB.items = DB.items.filter(it=>!allFolderIds.includes(it.folderId));
  DB.folders = DB.folders.filter(fl=>!allFolderIds.includes(fl.id));
  STATE.currentPath = STATE.currentPath.filter(p=>!allFolderIds.includes(p.id));
  persist(); render(); toast('フォルダを削除しました');
}

}

function csvEscape(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function buildCsv(){
  const header = ['ファイルID','ファイル名/タイトル','URL','カテゴリ名','所属親フォルダID','所属親フォルダ名','フォルダパス'];
  const rows = [header.join(',')];
  DB.items.forEach(it=>{
    const f = folderById(it.folderId);
    rows.push([
      it.id, it.title, it.url, catName(it.categoryId),
      it.folderId||'', f? f.name:'', folderPath(it.folderId)
    ].map(csvEscape).join(','));
  });
  return '\uFEFF' + rows.join('\r\n');
}

  toast('CSVを出力しました');
});

function parseCsv(text){
  // simple RFC4180-ish parser
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes=false; }
      }else{ field += c; }
    }else{
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else{ field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r.length===1 && r[0]!==''));
}

function ensureFolderPath(pathStr){
  // creates folders along "A ＞ B ＞ C" if missing, returns leaf folder id
  const seps = /[＞>]/;
  const names = String(pathStr||'').split(seps).map(s=>s.trim()).filter(Boolean);
  let parentId = null;
  let leaf = null;
  names.forEach(name=>{
    let f = DB.folders.find(x=>x.parentId===parentId && x.name===name);
    if(!f){
      const sibs = DB.folders.filter(x=>x.parentId===parentId);
      f = {id: nextId('folder', DB.folders), name, parentId, order:sibs.length};
      DB.folders.push(f);
    }
    parentId = f.id;
    leaf = f.id;
  });
  return leaf;
}

document.getElementById('csvFileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const text = reader.result.replace(/^\uFEFF/, '');
      const rows = parseCsv(text);
      if(rows.length < 1) throw new Error('データがありません');
      const header = rows[0];
      const idx = {
        id: header.indexOf('ファイルID'),
        title: header.indexOf('ファイル名/タイトル'),
        url: header.indexOf('URL'),
        cat: header.indexOf('カテゴリ名'),
        parentFolderId: header.indexOf('所属親フォルダID'),
        parentFolderName: header.indexOf('所属親フォルダ名'),
        path: header.indexOf('フォルダパス')
      };
      if(idx.title<0 || idx.url<0){ throw new Error('必須列（ファイル名/タイトル, URL）が見つかりません'); }
      if(!confirm(`CSVから${rows.length-1}件のリンクを取り込みます。IDが一致する項目は更新、それ以外は新規追加されます。よろしいですか？`)) return;

      for(let r=1;r<rows.length;r++){
        const row = rows[r];
        const idVal = idx.id>=0 ? row[idx.id] : '';
        const titleVal = row[idx.title] || '(無題)';
        const urlVal = row[idx.url] || '#';
        const catNameVal = idx.cat>=0 ? row[idx.cat] : '';
        const pathVal = idx.path>=0 ? row[idx.path] : '';

        let cat = DB.categories.find(c=>c.name===catNameVal);
        if(!cat && catNameVal){
          cat = {id: nextId('cat', DB.categories), name:catNameVal};
          DB.categories.push(cat);
        }
        let folderId = pathVal ? ensureFolderPath(pathVal) : null;
        if(!folderId){
          // fallback: put into a generic "CSV取込" folder
          let f = DB.folders.find(x=>x.parentId===null && x.name==='CSV取込');
          if(!f){ f = {id: nextId('folder', DB.folders), name:'CSV取込', parentId:null, order:DB.folders.filter(x=>x.parentId===null).length}; DB.folders.push(f); }
          folderId = f.id;
        }

        let existing = idVal ? DB.items.find(it=>it.id===idVal) : null;
        if(existing){
          existing.title = titleVal; existing.url = urlVal;
          if(cat) existing.categoryId = cat.id;
          existing.folderId = folderId;
        }else{
          const sibs = DB.items.filter(it=>it.folderId===folderId);
          const newItem = {
            id: (idVal && !DB.items.find(it=>it.id===idVal)) ? idVal : nextId('item', DB.items),
            title:titleVal, url:urlVal,
            categoryId: cat? cat.id : (DB.categories[0]? DB.categories[0].id:'cat_01'),
            siteId: (DB.sites.find(s=>s.categoryId===(cat?cat.id:''))||DB.sites[0]||{}).id || '',
            folderId, order: sibs.length
          };
          DB.items.push(newItem);
        }
      }
      persist(); renderSettings(); render();
      toast('CSVを取り込みました');
    }catch(err){
      alert('CSVの読み込みに失敗しました: '+err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});

/* =========================================================
   15. ツールバー操作
   ========================================================= */
document.getElementById('modeSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-mode]');
  if(!btn) return;
  STATE.mode = btn.dataset.mode;
  render();
});
document.getElementById('classSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-class]');
  if(!btn) return;
  STATE.classification = btn.dataset.class;
  STATE.currentPath = [];
  STATE.addContext = {type:null, id:null};
  render();
});
document.getElementById('searchInput').addEventListener('input', e=>{
  STATE.search = e.target.value;
  renderMain();
});
document.getElementById('sortSelect').addEventListener('change', e=>{
  STATE.sort = e.target.value;
  renderMain();
});
document.getElementById('btnNewFile').addEventListener('click', ()=>{
  openItemModal({mode:'add'});
});
document.getElementById('btnNewFolder').addEventListener('click', ()=>{
  if(STATE.classification!=='unit'){ toast('新規フォルダは単元分類でのみ追加できます'); return; }
  openFolderModal({mode:'add'});
});

/* =========================================================
   16. 初期表示
   ========================================================= */
render();
})();
</script>
</body>
</html>
